<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>COCKROACH</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:#050505;color:#fff;overflow-x:hidden}
body{background:radial-gradient(circle at 50% 35%,#242424 0,#0b0b0b 42%,#000 100%);min-height:100vh}
body:before{content:"";position:fixed;inset:-20%;background:repeating-radial-gradient(circle at center,transparent 0 70px,rgba(255,255,255,.025) 71px 72px);animation:spin 30s linear infinite;pointer-events:none}
@keyframes spin{to{transform:rotate(360deg)}} @keyframes pulse{50%{transform:scale(1.05);box-shadow:0 0 50px rgba(255,255,255,.2)}}
@keyframes rise{from{opacity:0;transform:translateY(35px) scale(.96)}to{opacity:1;transform:none}}
@keyframes slideIn{from{opacity:0;transform:translateX(80px) scale(.97)}to{opacity:1;transform:none}}
@keyframes slideOut{to{opacity:0;transform:translateX(-80px) scale(.97)}}
@keyframes glow{50%{text-shadow:0 0 30px rgba(255,255,255,.6)}}
.screen{min-height:100vh;display:none;align-items:center;justify-content:center;padding:30px;position:relative;z-index:1}
.screen.active{display:flex;animation:rise .7s cubic-bezier(.2,.8,.2,1)}
.hero{text-align:center}.title{font-size:clamp(3.5rem,12vw,9rem);letter-spacing:.16em;margin:0 0 30px;font-weight:900;animation:glow 2.4s ease-in-out infinite}
.enter{border:1px solid #fff;background:#fff;color:#000;border-radius:999px;padding:17px 48px;font-size:1rem;font-weight:800;letter-spacing:.22em;cursor:pointer;transition:.25s}
.enter:hover{transform:translateY(-4px) scale(1.04);box-shadow:0 12px 40px rgba(255,255,255,.25)}
.names{width:min(900px,100%);display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:18px}
.name{position:relative;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.055);backdrop-filter:blur(10px);padding:30px 18px;border-radius:22px;color:#fff;font-size:1.2rem;font-weight:800;letter-spacing:.08em;cursor:pointer;overflow:hidden;transition:.3s}
.name:after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,transparent,rgba(255,255,255,.15),transparent);transform:translateX(-110%);transition:.6s}
.name:hover{transform:translateY(-8px);border-color:#fff;box-shadow:0 18px 45px rgba(0,0,0,.45)}
.name:hover:after{transform:translateX(110%)}
.card{text-align:center;width:min(800px,100%);padding:50px 30px;border:1px solid rgba(255,255,255,.16);border-radius:32px;background:rgba(255,255,255,.06);backdrop-filter:blur(16px);box-shadow:0 25px 80px rgba(0,0,0,.45)}
.person{font-size:clamp(3rem,9vw,7rem);margin:0 0 16px;letter-spacing:.1em;animation:glow 2s ease-in-out infinite}
.sub{opacity:.7;letter-spacing:.18em;text-transform:uppercase}
.back{position:absolute;left:24px;top:24px;border:1px solid rgba(255,255,255,.3);background:rgba(0,0,0,.35);color:#fff;padding:11px 17px;border-radius:999px;cursor:pointer;backdrop-filter:blur(8px);transition:.25s}
.back:hover{background:#fff;color:#000;transform:translateX(-4px)}
.music{position:fixed;right:22px;bottom:22px;z-index:10;border:1px solid rgba(255,255,255,.3);background:rgba(0,0,0,.5);color:#fff;border-radius:999px;padding:11px 16px;cursor:pointer;backdrop-filter:blur(8px)}
@media(max-width:600px){.names{grid-template-columns:1fr 1fr}.name{padding:24px 10px;font-size:1rem}.card{padding:45px 20px}.title{letter-spacing:.1em}}
</style>
</head>
<body>
<audio id="audio" preload="auto" loop></audio>
<button class="music" id="musicBtn" aria-label="Play or pause music">♫ Play</button>

<section class="screen active" id="p1">
  <div class="hero">
    <h1 class="title">COCKROACH</h1>
    <button class="enter" onclick="go(2)">ENTER</button>
  </div>
</section>

<section class="screen" id="p2">
  <button class="back" onclick="go(1)">← Back</button>
  <div class="hero">
    <h2 style="font-size:2.2rem;margin-bottom:30px;letter-spacing:.1em">CHOOSE A NAME</h2>
    <div class="names">
      <button class="name" onclick="person(3,'KARTIK','parsasan.mp3')">KARTIK</button>
      <button class="name" onclick="person(4,'SUMIT','devra.mp3')">SUMIT</button>
      <button class="name" onclick="person(5,'ANURAG','mehraru.mp3')">ANURAG</button>
      <button class="name" onclick="person(6,'GARVIT','khajana.mp3')">GARVIT</button>
      <button class="name" onclick="person(7,'MAHI','heroine.mp3')">MAHI</button>
    </div>
  </div>
</section>

<section class="screen" id="p3"><button class="back" onclick="go(2)">← Back</button><div class="card"><h2 class="person">KARTIK</h2><p class="sub">Welcome to Kartik's page</p></div></section>
<section class="screen" id="p4"><button class="back" onclick="go(2)">← Back</button><div class="card"><h2 class="person">SUMIT</h2><p class="sub">Welcome to Sumit's page</p></div></section>
<section class="screen" id="p5"><button class="back" onclick="go(2)">← Back</button><div class="card"><h2 class="person">ANURAG</h2><p class="sub">Welcome to Anurag's page</p></div></section>
<section class="screen" id="p6"><button class="back" onclick="go(2)">← Back</button><div class="card"><h2 class="person">GARVIT</h2><p class="sub">Welcome to Garvit's page</p></div></section>
<section class="screen" id="p7"><button class="back" onclick="go(2)">← Back</button><div class="card"><h2 class="person">MAHI</h2><p class="sub">Welcome to Mahi's page</p></div></section>

<script>
const audio=document.getElementById('audio'), btn=document.getElementById('musicBtn');
let current=1;
const tracks={1:'assets/gucci.mp3',2:'assets/gucci.mp3',3:'assets/parsasan.mp3',4:'assets/devra.mp3',5:'assets/mehraru.mp3',6:'assets/khajana.mp3',7:'assets/heroine.mp3'};

function setTrack(page){
  const src=tracks[page]; if(!src)return;
  if(audio.getAttribute('src')!==src){
    audio.pause(); audio.src=src; audio.currentTime=0;
    audio.play().then(()=>btn.textContent='♫ Pause').catch(()=>btn.textContent='♫ Play');
  } else if(audio.paused) audio.play().then(()=>btn.textContent='♫ Pause').catch(()=>{});
}
function go(page){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  const target=document.getElementById('p'+page); target.classList.add('active'); current=page;
  setTrack(page);
}
function person(page,name,track){ go(page); }
btn.onclick=()=>{if(audio.paused){audio.play().then(()=>btn.textContent='♫ Pause')}else{audio.pause();btn.textContent='♫ Play'}};
window.addEventListener('load',()=>{audio.src=tracks[1]});
</script>
</body>
</html>
